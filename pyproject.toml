[project]
name = "lpdg-gateway-predictor"
version = "1.0.0"
description = "Predictive maintenance for IoT gateways — LPDG Innovation Hub 2026"
requires-python = ">=3.12"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
